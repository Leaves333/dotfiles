[opener]
edit = [
	{ run = 'nvim %s', block = true },
]
image = [
	{ run = '~/.config/yazi/open_image.sh %s', orphan = true },
]
video = [
	{ run = 'mpv %s', orphan = true },
]
audio = [
	{ run = 'mpv --force-window=yes %s', orphan = true },
]
pdf = [
	{ run = 'zathura %s', orphan = true },
]

[open]
prepend_rules = [
	{ mime = "image/*", use = "image" },
	{ mime = "video/*", use = "video" },
	{ mime = "audio/*", use = "audio" },
	{ mime = "application/pdf", use = "pdf" },
]

[preview]
max_width       = 1200
max_height      = 1800
